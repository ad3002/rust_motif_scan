[package]
name = "rust_motif_scan"
version = "0.3.0"
edition = "2021"
authors = ["Aleksey Komissarov <ad3002@gmail.com>"]
description = "Fast zero-dependency IUPAC degenerate-motif scanner (both strands, BED output) with a dedicated CENP-B box mode: left-arm / spacer / right-arm decomposition and Hamming-to-canonical integrity scoring."
license = "MIT"
repository = "https://github.com/ad3002/rust_motif_scan"
readme = "README.md"
keywords = ["bioinformatics", "motif", "iupac", "genomics", "cenp-b"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "rust_motif_scan"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
